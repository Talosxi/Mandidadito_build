name: Construir APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      
      - name: Instalar generador de iconos
        run: npm install @capacitor/assets
      - name: Generar iconos desde resources/icon.png
        run: npx @capacitor/assets generate --android
      
      - name: Leer versión desde package.json
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      
      - name: Actualizar versión en Android (versionName + versionCode)
        run: |
          sed -i 's/versionName ".*"/versionName "${{ steps.version.outputs.VERSION }}"/' android/app/build.gradle
          FECHA=$(date +%Y%m%d)
          VERSION_CODE=$((FECHA * 100 + ${{ github.run_number }}))
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          echo "versionCode actualizado a: $VERSION_CODE"
      
      - name: Decodificar Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/mandadito.keystore
      
      - name: Configurar firma en build.gradle
        run: |
          cat >> android/app/build.gradle << 'EOF'

          // Configuración de firma
          android {
              signingConfigs {
                  release {
                      storeFile file("mandadito.keystore")
                      storePassword "${{ secrets.KEYSTORE_PASSWORD }}"
                      keyAlias "${{ secrets.KEY_ALIAS }}"
                      keyPassword "${{ secrets.KEY_PASSWORD }}"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
      
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      
      - name: Renombrar APK con versión
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/mandadito-v${{ steps.version.outputs.VERSION }}.apk
      
      - uses: actions/upload-artifact@v4
        with:
          name: mandadito-apk-v${{ steps.version.outputs.VERSION }}
          path: android/app/build/outputs/apk/debug/mandadito-v${{ steps.version.outputs.VERSION }}.apk
          retention-days: 1
